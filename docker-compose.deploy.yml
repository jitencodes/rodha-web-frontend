# Server deploy — run a pre-built registry image (no build on the host).
#
#   export IMAGE="$CI_REGISTRY_IMAGE:development-<sha>"
#   docker compose -f docker-compose.deploy.yml up -d

services:
  web:
    image: ${IMAGE:?Set IMAGE to the GitLab registry tag}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    pull_policy: always
