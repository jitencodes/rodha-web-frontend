# Local Docker Compose for Rodha Web Frontend
#
# Development image (dev API from `.env`):
#   docker compose up --build
# Production image (prod API from `.env.production`):
#   APP_ENV=production docker compose up --build

services:
  web:
    image: ${IMAGE:-rodha-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
