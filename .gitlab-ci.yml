# Rodha Web Frontend — GitLab CI/CD
#
#   main        → production (for now) → image :production-<sha> / :production-latest, auto-deploy
#   production  → image :production-<sha>  / :production-latest
#
# Images are built from the Dockerfile on the ARM64 runner (tag `arm`, shell
# executor with Docker) and pushed to AWS ECR. Docker Compose is for local dev only.
#
# GitLab CI/CD variables:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION — ECR push
#   EC2_HOST, EC2_USER, EC2_PORT (SSH, default 22), PEM_FILE — EC2 deploy
#   App keys (see scripts/ci-write-env.mjs) — scoped to environment
#   development | production. See docs/DEPLOYMENT_GITLAB.md.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - build
  - deploy

default:
  tags:
    - arm
  interruptible: true

variables:
  NODE_IMAGE: "node:22-alpine"
  ECR_REGISTRY: "976416649390.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_IMAGE: "$ECR_REGISTRY/rodha-website"
  APP_PORT: "3000"

# Node is not installed on the runner: run Node commands in $NODE_IMAGE as the
# runner user, forwarding only app env keys (NEXT_PUBLIC_*, API_*, EMAIL_*).
.node_run: &node_run
  - |
    node_run() {
      local env_args=(-e CI -e HOME=/tmp -e npm_config_cache=/app/.npm -e NEXT_TELEMETRY_DISABLED=1)
      for k in $(compgen -e | grep -E '^(NEXT_PUBLIC_|API_|EMAIL_)'); do env_args+=(-e "$k"); done
      docker run --rm -u "$(id -u):$(id -g)" -v "$CI_PROJECT_DIR:/app" -w /app \
        "${env_args[@]}" "$NODE_IMAGE" sh -c "$1"
    }

validate:
  stage: validate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - *node_run
  script:
    - node_run "npm ci --prefer-offline && npx tsc --noEmit"

# Reports lint issues without blocking build/deploy (existing errors to clean up).
lint:
  stage: validate
  allow_failure: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - *node_run
  script:
    - node_run "npm ci --prefer-offline && npm run lint"

build:
  stage: build
  needs:
    - validate
  environment:
    name: $APP_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        APP_ENV: production  # main deploys production for now
    - if: $CI_COMMIT_BRANCH == "production"
      variables:
        APP_ENV: production
  before_script:
    - *node_run
  script:
    - set -o pipefail
    # .env in the build context bakes NEXT_PUBLIC_* into the image
    - node_run "node scripts/ci-write-env.mjs"
    - test -n "$NEXT_PUBLIC_API_BASE_URL" || { echo "Missing NEXT_PUBLIC_API_BASE_URL for $APP_ENV"; exit 1; }
    - docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        amazon/aws-cli:2.17.0 ecr get-login-password
        | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker build --pull -t "$ECR_IMAGE:$APP_ENV-$CI_COMMIT_SHORT_SHA" -t "$ECR_IMAGE:$APP_ENV-latest" .
    - docker push "$ECR_IMAGE:$APP_ENV-$CI_COMMIT_SHORT_SHA"
    - docker push "$ECR_IMAGE:$APP_ENV-latest"
  after_script:
    - rm -f .env
    - docker logout "$ECR_REGISTRY" || true

# Pull the pushed image on EC2 and (re)start the container. The ECR token is
# generated on the runner and piped over SSH, so EC2 only needs Docker.
# PEM_FILE is a GitLab "File" variable: $PEM_FILE is the path to the private key.
deploy:
  stage: deploy
  needs:
    - build
  environment:
    name: $APP_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        APP_ENV: production  # main deploys production for now
    - if: $CI_COMMIT_BRANCH == "production"
      variables:
        APP_ENV: production
      when: manual
  before_script:
    - *node_run
  script:
    - set -o pipefail
    - test -n "$EC2_HOST" && test -n "$EC2_USER" || { echo "Missing EC2_HOST / EC2_USER"; exit 1; }
    - test -f "$PEM_FILE" || { echo "PEM_FILE must be a GitLab File variable"; exit 1; }
    # Copy with 0600 + trailing newline (ssh rejects open perms / unterminated keys)
    - KEY="$CI_PROJECT_DIR/.ec2.pem"
    - (umask 077; tr -d '\r' < "$PEM_FILE" > "$KEY"; echo >> "$KEY")
    - SSH="ssh -i $KEY -p ${EC2_PORT:-22} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$CI_PROJECT_DIR/.ec2_known_hosts $EC2_USER@$EC2_HOST"
    # Runtime env (server-only secrets like SMTP) for the container
    - node_run "node scripts/ci-write-env.mjs"
    - $SSH "mkdir -p ~/rodha-web && cat > ~/rodha-web/$APP_ENV.env && chmod 600 ~/rodha-web/$APP_ENV.env" < .env
    - docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        amazon/aws-cli:2.17.0 ecr get-login-password
        | $SSH "docker login --username AWS --password-stdin $ECR_REGISTRY"
    - |
      $SSH "bash -s" <<EOF
      set -e
      IMAGE="$ECR_IMAGE:$APP_ENV-$CI_COMMIT_SHORT_SHA"
      NAME="rodha-web-$APP_ENV"
      docker pull "\$IMAGE"
      docker rm -f "\$NAME" 2>/dev/null || true
      docker run -d --name "\$NAME" --restart unless-stopped \\
        -p $APP_PORT:3000 --env-file ~/rodha-web/$APP_ENV.env "\$IMAGE"
      docker logout $ECR_REGISTRY || true
      docker image prune -f
      EOF
  after_script:
    - rm -f .env .ec2.pem .ec2_known_hosts
