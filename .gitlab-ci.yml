# Rodha Web Frontend — GitLab CI/CD
#
#   main        → development  → image :development-<sha> / :development-latest (no deploy)
#   production  → production   → image :production-<sha>  / :production-latest → auto-deploy to EC2
#
# Public API URLs come from committed files (scripts/select-env.mjs), not CI variables:
#   main / development  → .env              NEXT_PUBLIC_API_BASE_URL=https://innowrap.co.in/rodha/
#   production          → .env.production   NEXT_PUBLIC_API_BASE_URL=https://api.rodha.co.in/rodha/
#
# Images are built on the ARM64 runner (tag `arm`) and pushed to AWS ECR.
# GitLab variables: AWS_* (ECR), EC2_HOST / EC2_USER / EC2_PORT / PEM_FILE (deploy),
# and optional secrets EMAIL_SMTP_PASS / API_KEY. Do not set NEXT_PUBLIC_API_BASE_URL in CI.


workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - build
  - deploy

default:
  tags:
    - arm
  interruptible: true

variables:
  NODE_IMAGE: "node:22-alpine"
  ECR_REGISTRY: "976416649390.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_IMAGE: "$ECR_REGISTRY/rodha-website"
  APP_PORT: "3000"

.node_run: &node_run
  - |
    node_run() {
      local env_args=(-e CI=true -e GITLAB_CI=true -e HOME=/tmp -e npm_config_cache=/app/.npm -e NEXT_TELEMETRY_DISABLED=1)
      if [ -n "${APP_ENV:-}" ]; then env_args+=(-e "APP_ENV=$APP_ENV"); fi
      if [ -n "${CI_COMMIT_BRANCH:-}" ]; then env_args+=(-e "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"); fi
      for k in $(compgen -e | grep -E '^(NEXT_PUBLIC_|API_|EMAIL_)'); do env_args+=(-e "$k"); done
      docker run --rm -u "$(id -u):$(id -g)" -v "$CI_PROJECT_DIR:/app" -w /app \
        "${env_args[@]}" "$NODE_IMAGE" sh -c "$1"
    }

validate:
  stage: validate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - *node_run
  script:
    - node_run "npm ci --prefer-offline && npx tsc --noEmit"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: validate
  allow_failure: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - *node_run
  script:
    - node_run "npm ci --prefer-offline && npm run lint"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.ecr_login: &ecr_login
  - |
    docker run --rm \
      -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
      amazon/aws-cli:2.17.0 ecr get-login-password \
      | docker login --username AWS --password-stdin "$ECR_REGISTRY"

build:
  stage: build
  needs:
    - validate
  environment:
    name: $APP_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        APP_ENV: development
    - if: $CI_COMMIT_BRANCH == "production"
      variables:
        APP_ENV: production
  before_script:
    - *node_run
  script:
    - set -o pipefail
    - node_run "node scripts/select-env.mjs"
    - |
      if [ "$APP_ENV" = "production" ]; then
        grep -q "NEXT_PUBLIC_API_BASE_URL=https://api.rodha.co.in/rodha/" .env
      else
        grep -q "NEXT_PUBLIC_API_BASE_URL=https://innowrap.co.in/rodha/" .env
      fi
    - *ecr_login
    - |
      docker build --pull \
        --build-arg APP_ENV="$APP_ENV" \
        -t "$ECR_IMAGE:$APP_ENV-$CI_COMMIT_SHORT_SHA" \
        -t "$ECR_IMAGE:$APP_ENV-latest" \
        .
    - docker push "$ECR_IMAGE:$APP_ENV-$CI_COMMIT_SHORT_SHA"
    - docker push "$ECR_IMAGE:$APP_ENV-latest"
  after_script:
    - rm -f .env
    - docker logout "$ECR_REGISTRY" || true

deploy:
  stage: deploy
  needs:
    - build
  environment:
    name: $APP_ENV
  # Only the production branch deploys to EC2 (automatically); main never deploys.
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      variables:
        APP_ENV: production
  before_script:
    - *node_run
  script:
    - set -o pipefail
    - test -n "$EC2_HOST" && test -n "$EC2_USER" || { echo "Missing EC2_HOST / EC2_USER"; exit 1; }
    - test -f "$PEM_FILE" || { echo "PEM_FILE must be a GitLab File variable"; exit 1; }
    - KEY="$CI_PROJECT_DIR/.ec2.pem"
    - (umask 077; tr -d '\r' < "$PEM_FILE" > "$KEY"; echo >> "$KEY")
    - SSH="ssh -i $KEY -p ${EC2_PORT:-22} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$CI_PROJECT_DIR/.ec2_known_hosts $EC2_USER@$EC2_HOST"
    - node_run "node scripts/select-env.mjs"
    - |
      if [ "$APP_ENV" = "production" ]; then
        grep -q "NEXT_PUBLIC_API_BASE_URL=https://api.rodha.co.in/rodha/" .env
      else
        grep -q "NEXT_PUBLIC_API_BASE_URL=https://innowrap.co.in/rodha/" .env
      fi
    - $SSH "mkdir -p ~/rodha-web && cat > ~/rodha-web/$APP_ENV.env && chmod 600 ~/rodha-web/$APP_ENV.env" < .env
    - |
      docker run --rm \
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
        amazon/aws-cli:2.17.0 ecr get-login-password \
        | $SSH "docker login --username AWS --password-stdin $ECR_REGISTRY"
    - |
      $SSH "bash -s" <<EOF
      set -e
      IMAGE="$ECR_IMAGE:$APP_ENV-$CI_COMMIT_SHORT_SHA"
      NAME="rodha-web-$APP_ENV"
      docker pull "\$IMAGE"
      docker rm -f "\$NAME" 2>/dev/null || true
      docker run -d --name "\$NAME" --restart unless-stopped \\
        -p $APP_PORT:3000 --env-file ~/rodha-web/$APP_ENV.env "\$IMAGE"
      docker logout $ECR_REGISTRY || true
      docker image prune -f
      EOF
  after_script:
    - rm -f .env .ec2.pem .ec2_known_hosts
