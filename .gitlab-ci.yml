# Rodha Web Frontend — GitLab CI/CD
#
# Branches:
#   main        → development (environment: development)
#   production  → production  (environment: production)
#
# Configure the SAME variable names twice in GitLab → Settings → CI/CD → Variables,
# each scoped to Environment = development | production. Never use unscoped
# duplicates of the same key, or values will collide.
#
# See docs/DEPLOYMENT_GITLAB.md for the full variable checklist.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - build
  - deploy

default:
  image: node:20-bookworm
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# ---------------------------------------------------------------------------
# Shared anchors
# ---------------------------------------------------------------------------

.node_setup: &node_setup
  before_script:
    - node -v
    - npm -v
    - npm ci --prefer-offline
    - node scripts/ci-write-env.mjs

# ---------------------------------------------------------------------------
# Validate (both branches + MRs)
# ---------------------------------------------------------------------------

validate:
  stage: validate
  <<: *node_setup
  script:
    - npx tsc --noEmit
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Build — development (main)
# ---------------------------------------------------------------------------

build:development:
  stage: build
  <<: *node_setup
  environment:
    name: development
  script:
    - echo "Building for DEVELOPMENT (branch=$CI_COMMIT_BRANCH)"
    - test -n "$NEXT_PUBLIC_API_BASE_URL" || (echo "Missing NEXT_PUBLIC_API_BASE_URL for development" && exit 1)
    - npm run build
  artifacts:
    name: "rodha-web-dev-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - .env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Build — production (production branch)
# ---------------------------------------------------------------------------

build:production:
  stage: build
  <<: *node_setup
  environment:
    name: production
  script:
    - echo "Building for PRODUCTION (branch=$CI_COMMIT_BRANCH)"
    - test -n "$NEXT_PUBLIC_API_BASE_URL" || (echo "Missing NEXT_PUBLIC_API_BASE_URL for production" && exit 1)
    - npm run build
  artifacts:
    name: "rodha-web-prod-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - .env
  rules:
    - if: $CI_COMMIT_BRANCH == "production"

# ---------------------------------------------------------------------------
# Deploy — optional SSH/rsync + pm2 (manual until DEPLOY_* vars are set)
# Uses environment-scoped DEPLOY_HOST / DEPLOY_USER / DEPLOY_PATH / SSH_PRIVATE_KEY
# ---------------------------------------------------------------------------

.deploy_template: &deploy_template
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_PATH}" ]; then
        echo "Deploy skipped: set environment-scoped SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH"
        exit 1
      fi
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - |
      if [ -n "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
        echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      fi
      chmod 644 ~/.ssh/known_hosts
  script:
    - |
      rsync -az --delete \
        .next public package.json package-lock.json next.config.ts .env \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
    - |
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -lc '
        set -e
        cd \"${DEPLOY_PATH}\"
        npm ci --omit=dev
        if command -v pm2 >/dev/null 2>&1; then
          pm2 restart \"${DEPLOY_PM2_NAME:-rodha-web}\" || pm2 start npm --name \"${DEPLOY_PM2_NAME:-rodha-web}\" -- start
          pm2 save || true
        else
          echo \"pm2 not found — artifacts synced; start the app manually with npm start\"
        fi
      '"

deploy:development:
  <<: *deploy_template
  environment:
    name: development
    url: $NEXT_PUBLIC_BASE_URL
  needs:
    - build:development
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

deploy:production:
  <<: *deploy_template
  environment:
    name: production
    url: $NEXT_PUBLIC_BASE_URL
  needs:
    - build:production
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: manual
      allow_failure: false
